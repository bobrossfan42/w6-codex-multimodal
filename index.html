<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local LLM Multi-modal Image Describer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Local LLM Multi-modal Image Describer</h1>
        <form id="imageForm">
            <label for="imageInput">Upload Image:</label>
            <input type="file" id="imageInput" accept="image/*" required />
            
            <div id="previewContainer" class="empty-preview" aria-live="polite">
                <span id="previewPlaceholder">No image selected</span>
                <img id="imagePreview" alt="Selected image preview" />
            </div>

            <button type="submit" id="submitButton" disabled>Describe Image</button>
        </form>

        <!-- Status and Feedback Areas -->
        <div id="loadingMessage" style="display: none;">
            AI is processing the image... (This may take a moment)
        </div>
        <p id="error"></p>

        <section id="resultContainer">
            <h2>LLM Response:</h2>
            <article id="aiOutput" aria-live="polite">Waiting for input...</article>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
